environment: "development"

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  artifacts_dir: "artifacts"

logging:
  level: "INFO"
  json_format: true

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "energycast-ai"

serving:
  host: "0.0.0.0"
  port: 8000
  # The registered roster model served by default. The M7 champion.
  champion_model: "lstm"

monitoring:
  # Own SQLite file: served forecasts persist here to be scored once the hours
  # they predicted are measured. Separate from mlflow.db, which owns runs.
  database_path: "monitoring.db"
  # Rolling metrics span the anchors within this many days of the most recent
  # one on record, so the window slides with the data instead of wall-clock.
  rolling_window_days: 30

drift:
  # Own SQLite file, sibling of monitoring.db: each drift run's dataset-level
  # signal is persisted here for the retraining trigger to read later.
  database_path: "drift.db"
  # The current window spans this many days of the most recent measured hours,
  # compared against the training distribution as reference.
  window_days: 30
  # Share of magnitude columns that must drift before the dataset is called
  # drifted. Evidently's DriftedColumnsCount threshold.
  drift_share: 0.5
  # Per-column statistical test for the numeric magnitude columns.
  method: "wasserstein"
  # Where the human-facing Evidently HTML snapshot of each run is written.
  snapshot_dir: "artifacts/drift"

retraining:
  # Own SQLite file: each retraining cycle logs what triggered it and whether a
  # challenger was promoted, and its data cutoff is the baseline for counting new
  # observations on the next run.
  database_path: "retraining.db"
  # A retrain fires when ANY enabled condition trips (OR), never on a fixed cron.
  # The latest drift run's verdict trips the drift condition.
  drift_triggers: true
  # Rolling RMSE mean over this window, above this many MW, trips the error one.
  rolling_window_days: 30
  rmse_threshold: 2500.0
  # Measured hours accumulated past the champion's data cutoff, above this count,
  # trips the volume one.
  new_observations_threshold: 720
  # Fraction by which a challenger's RMSE must beat the champion's to be promoted.
  promotion_margin: 0.0
